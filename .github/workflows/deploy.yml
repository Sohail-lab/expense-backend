name: Deploy Expense Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, Build, and Swap on OCI
        run: |
          ssh -i ~/.ssh/oci_key "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" '
            set -e
            source ~/.nvm/nvm.sh
            cd ~/prod/expense-backend

            echo "Pulling latest code from main..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Backing up current dist to dist-old..."
            rm -rf dist-old
            if [ -d "dist" ]; then
              mv dist dist-old
            fi

            echo "Building project into temporary directory or overwriting dist..."
            if ! npm run build; then
              echo "Build failed! Restoring dist-old to dist..."
              rm -rf dist
              if [ -d "dist-old" ]; then
                mv dist-old dist
              fi
              exit 1
            fi
          '

      - name: Restart service
        run: |
          ssh -i ~/.ssh/oci_key \
            "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
            "sudo systemctl restart expensesplit.service"

      - name: Verify service
        run: |
          ssh -i ~/.ssh/oci_key \
            "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
            "sudo systemctl is-active --quiet expensesplit.service"