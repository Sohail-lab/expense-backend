name: Database Restore

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: 'Direct GitHub artifact download URL or zip file link'
        required: true
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MySQL Client and Unzip
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client unzip

      - name: Download Artifact via URL
        env:
          DOWNLOAD_URL: ${{ inputs.artifact_url }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          mkdir -p ./restore_dir
          cd ./restore_dir
          
          echo "Downloading artifact from URL..."
          # Use curl with GitHub token authorization in case it's a protected GitHub API link
          curl -L -H "Authorization: Bearer $GH_TOKEN" "$DOWNLOAD_URL" -o backup.zip
          
          # Unzip the downloaded archive
          unzip -o backup.zip
          
          # Find the extracted .sql file
          SQL_FILE=$(find . -name "*.sql" | head -n 1)
          echo "Found SQL file: $SQL_FILE"
          echo "SQL_FILE_PATH=$SQL_FILE" >> $GITHUB_ENV

      - name: Restore Database via SSH Tunnel
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          FILE_PATH="./restore_dir/$SQL_FILE_PATH"
          
          if [ -f "$FILE_PATH" ]; then
            echo "Setting up SSH tunnel..."
            echo "$OCI_SSH_KEY" > ssh-key.key
            chmod 600 ssh-key.key
            
            # Open SSH tunnel in the background
            ssh -o StrictHostKeyChecking=no \
                -i ssh-key.key \
                -L 3307:$DB_HOST:$DB_PORT \
                $OCI_USER@$OCI_HOST -N &
            
            SSH_PID=$!
            sleep 3
            
            echo "Restoring database from $FILE_PATH via localhost:3307..."
            
            # Restore targeting local forwarded port with SSL enforced
            mysql -h 127.0.0.1 \
                  -P 3307 \
                  -u "$DB_USER" \
                  -p"$DB_PASSWORD" \
                  --ssl-mode=REQUIRED \
                  "$DB_NAME" < "$FILE_PATH"
                  
            # Clean up tunnel and key file
            kill $SSH_PID
            rm ssh-key.key
            
            echo "Database restore completed successfully!"
          else
            echo "Error: Extracted SQL backup file not found at $FILE_PATH"
            exit 1
          fi